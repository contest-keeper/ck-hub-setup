version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /infra/azure
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: docker-compose
    directory: /compose
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
